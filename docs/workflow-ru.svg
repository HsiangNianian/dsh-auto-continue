<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1152" viewBox="0 0 1200 1152" role="img" lang="ru" aria-labelledby="title description">
  <title id="title">Как auto-continue принимает решение</title>
  <desc id="description">Блок-схема. Три источника (ход завершился, хост перезапустился, ход зациклился) проходят проверку сессии, затем причина завершения определяет действие: ничего не делать, восстановить или продолжить автономный цикл. Восстановление проверяет лимит попыток, ждёт паузу, удерживает отправку без сети и отправляет текст продолжения. Дочерние сессии передаются корневой; «Resume now» отправляет сразу.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrowhead" d="M0 0L10 5L0 10Z"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .bg { fill: #f6f8fa; }
    .heading { fill: #1f2328; font-size: 24px; font-weight: 650; }
    .sub, .legend, .foot { fill: #59636e; font-size: 14px; }
    .card { fill: #ffffff; stroke: #d1d9e0; }
    .title { fill: #1f2328; font-size: 16px; font-weight: 650; }
    .body { fill: #424a53; font-size: 13.5px; }
    .key { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 12px; }
    .edge { fill: none; stroke: #8c959f; stroke-width: 1.6; }
    .arrowhead { fill: #8c959f; }
    .edge-label { fill: #59636e; font-size: 12px; }
    .source .strip, .source .key { fill: #0969da; }
    .gate .strip, .gate .key { fill: #9a6700; }
    .stop .strip, .stop .key { fill: #cf222e; }
    .loop .strip, .loop .key { fill: #8250df; }
    .send .strip, .send .key { fill: #1a7f37; }
    .send .card { stroke: #1a7f37; stroke-width: 1.5; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .heading, .title { fill: #e6edf3; }
      .sub, .legend, .foot, .edge-label { fill: #9198a1; }
      .card { fill: #161b22; stroke: #3d444d; }
      .body { fill: #c9d1d9; }
      .edge { stroke: #656c76; }
      .arrowhead { fill: #656c76; }
      .source .strip, .source .key { fill: #4493f8; }
      .gate .strip, .gate .key { fill: #d29922; }
      .stop .strip, .stop .key { fill: #f85149; }
      .loop .strip, .loop .key { fill: #ab7df8; }
      .send .strip, .send .key { fill: #3fb950; }
      .send .card { stroke: #3fb950; }
    }
  </style>
  <rect class="bg" width="1200" height="1152" rx="16"/>
  <text class="heading" x="30" y="46">Как auto-continue принимает решение</text>
  <text class="sub" x="30" y="72">Работает в хост-процессе DSH, один движок на все вкладки</text>
    <g class="node source"><rect class="strip" x="640.0000000000002" y="54" width="12" height="12" rx="3"/><text class="legend" x="658.0000000000002" y="65">Источник</text></g>
    <g class="node gate"><rect class="strip" x="748.8000000000002" y="54" width="12" height="12" rx="3"/><text class="legend" x="766.8000000000002" y="65">Проверка</text></g>
    <g class="node stop"><rect class="strip" x="857.6000000000001" y="54" width="12" height="12" rx="3"/><text class="legend" x="875.6000000000001" y="65">Стоп/ожидание</text></g>
    <g class="node loop"><rect class="strip" x="1008.8000000000001" y="54" width="12" height="12" rx="3"/><text class="legend" x="1026.8000000000002" y="65">Цикл</text></g>
    <g class="node send"><rect class="strip" x="1083.2" y="54" width="12" height="12" rx="3"/><text class="legend" x="1101.2" y="65">Отправка</text></g>
  <path class="edge" d="M175 216V234H1025V216"/>
  <path class="edge" d="M600 216V250" marker-end="url(#arrow)"/>
  <path class="edge" d="M600 356V390" marker-end="url(#arrow)"/>
  <path class="edge" d="M600 496V530" marker-end="url(#arrow)"/>
  <path class="edge" d="M600 636V670" marker-end="url(#arrow)"/>
  <path class="edge" d="M600 776V810" marker-end="url(#arrow)"/>
  <path class="edge" d="M600 916V950" marker-end="url(#arrow)"/>
  <path class="edge" d="M390 304H322" marker-end="url(#arrow)"/>
  <text class="edge-label" x="355" y="296" text-anchor="middle">нет</text>
  <path class="edge" d="M390 444H322" marker-end="url(#arrow)"/>
  <text class="edge-label" x="355" y="436" text-anchor="middle">стоп</text>
  <path class="edge" d="M390 584H322" marker-end="url(#arrow)"/>
  <text class="edge-label" x="355" y="576" text-anchor="middle">лимит</text>
  <path class="edge" d="M810 444H878" marker-end="url(#arrow)"/>
  <text class="edge-label" x="845" y="436" text-anchor="middle">цикл</text>
  <path class="edge" d="M1025 496V530" marker-end="url(#arrow)"/>
  <path class="edge" d="M1025 636V724H812" marker-end="url(#arrow)"/>
  <text class="edge-label" x="1035" y="658" text-anchor="start">ниже лимита</text>
  <path class="edge" d="M810 864H878" marker-end="url(#arrow)"/>
  <text class="edge-label" x="845" y="856" text-anchor="middle">нет сети</text>
  <path class="edge" d="M1110 812V740H812" marker-end="url(#arrow)"/>
  <text class="edge-label" x="1118" y="798" text-anchor="start">сеть есть</text>
  <path class="edge" d="M320 1004H388" marker-end="url(#arrow)"/>
  <text class="edge-label" x="355" y="996" text-anchor="middle">корню</text>
  <path class="edge" d="M880 1004H812" marker-end="url(#arrow)"/>
  <g class="node source">
    <rect class="card" x="30" y="112" width="290" height="104" rx="12"/>
    <rect class="strip" x="30" y="126" width="4" height="76" rx="2"/>
    <text class="title" x="50" y="140">Ход завершился</text>
    <text class="body" x="50" y="163">turn/end в открытой сессии:</text>
    <text class="body" x="50" y="182">error, max-tokens, пустой, completed</text>
    <text class="key" x="50" y="202">resumeSilentTurns</text>
  </g>
  <g class="node source">
    <rect class="card" x="390" y="112" width="420" height="104" rx="12"/>
    <rect class="strip" x="390" y="126" width="4" height="76" rx="2"/>
    <text class="title" x="410" y="140">Хост перезапустился</text>
    <text class="body" x="410" y="163">Стартовое сканирование открытых и</text>
    <text class="body" x="410" y="182">сохранённых сессий в пределах окна</text>
    <text class="key" x="410" y="202">scanOnBoot · freshMs · scanLimit</text>
  </g>
  <g class="node source">
    <rect class="card" x="880" y="112" width="290" height="104" rx="12"/>
    <rect class="strip" x="880" y="126" width="4" height="76" rx="2"/>
    <text class="title" x="900" y="140">Ход зациклился</text>
    <text class="body" x="900" y="163">Защита от циклов прерывает</text>
    <text class="body" x="900" y="182">текущий ход и запускает заново</text>
    <text class="key" x="900" y="202">loopGuard · loopText</text>
  </g>
  <g class="node gate">
    <rect class="card" x="390" y="252" width="420" height="104" rx="12"/>
    <rect class="strip" x="390" y="266" width="4" height="76" rx="2"/>
    <text class="title" x="410" y="280">Можно продолжать?</text>
    <text class="body" x="410" y="303">Нет глобальной паузы, режим не Off, нет</text>
    <text class="body" x="410" y="322">паузы на 1 час, это не сессия субагента</text>
    <text class="key" x="410" y="342">paused · sessionModes</text>
  </g>
  <g class="node stop">
    <rect class="card" x="30" y="252" width="290" height="104" rx="12"/>
    <rect class="strip" x="30" y="266" width="4" height="76" rx="2"/>
    <text class="title" x="50" y="280">Пропуск</text>
    <text class="body" x="50" y="303">Запись в лог [auto-continue],</text>
    <text class="body" x="50" y="322">ничего не отправляется</text>
  </g>
  <g class="node gate">
    <rect class="card" x="390" y="392" width="420" height="104" rx="12"/>
    <rect class="strip" x="390" y="406" width="4" height="76" rx="2"/>
    <text class="title" x="410" y="420">Почему ход завершился?</text>
    <text class="body" x="410" y="443">Ошибка, max-tokens, пустой ход, рестарт</text>
    <text class="body" x="410" y="462">или прерывание защитой: восстановить</text>
    <text class="key" x="410" y="482">classify · retryableErrorPatterns</text>
  </g>
  <g class="node stop">
    <rect class="card" x="30" y="392" width="290" height="104" rx="12"/>
    <rect class="strip" x="30" y="406" width="4" height="76" rx="2"/>
    <text class="title" x="50" y="420">Не трогать</text>
    <text class="body" x="50" y="443">Вы нажали Stop, политика</text>
    <text class="body" x="50" y="462">запретила, или ошибка постоянная</text>
  </g>
  <g class="node loop">
    <rect class="card" x="880" y="392" width="290" height="104" rx="12"/>
    <rect class="strip" x="880" y="406" width="4" height="76" rx="2"/>
    <text class="title" x="900" y="420">Автономный цикл</text>
    <text class="body" x="900" y="443">Ход завершён штатно в режиме Loop;</text>
    <text class="body" x="900" y="462">без паузы между попытками и лимита</text>
    <text class="key" x="900" y="482">resumeCompletedTurns</text>
  </g>
  <g class="node gate">
    <rect class="card" x="390" y="532" width="420" height="104" rx="12"/>
    <rect class="strip" x="390" y="546" width="4" height="76" rx="2"/>
    <text class="title" x="410" y="560">Попытки остались?</text>
    <text class="body" x="410" y="583">Меньше Max consecutive. В период cooldown</text>
    <text class="body" x="410" y="602">отправка ждёт (cooldown × factor, с потолком)</text>
    <text class="key" x="410" y="622">maxConsecutive · cooldownMs · backoff*</text>
  </g>
  <g class="node stop">
    <rect class="card" x="30" y="532" width="290" height="104" rx="12"/>
    <rect class="strip" x="30" y="546" width="4" height="76" rx="2"/>
    <text class="title" x="50" y="560">Остановка</text>
    <text class="body" x="50" y="583">Уведомление; счётчик сбросится,</text>
    <text class="body" x="50" y="602">когда вы напишете или ход даст ответ</text>
  </g>
  <g class="node loop">
    <rect class="card" x="880" y="532" width="290" height="104" rx="12"/>
    <rect class="strip" x="880" y="546" width="4" height="76" rx="2"/>
    <text class="title" x="900" y="560">Лимит раундов</text>
    <text class="body" x="900" y="583">На лимите цикл останавливается</text>
    <text class="body" x="900" y="602">и сообщает об этом; 0 = без лимита</text>
    <text class="key" x="900" y="622">loopMaxIterations</text>
  </g>
  <g class="node gate">
    <rect class="card" x="390" y="672" width="420" height="104" rx="12"/>
    <rect class="strip" x="390" y="686" width="4" height="76" rx="2"/>
    <text class="title" x="410" y="700">Пауза перед отправкой</text>
    <text class="body" x="410" y="723">По умолчанию 3 с. Новый ход или ваше</text>
    <text class="body" x="410" y="742">сообщение отменяют отправку</text>
    <text class="key" x="410" y="762">graceMs</text>
  </g>
  <g class="node gate">
    <rect class="card" x="390" y="812" width="420" height="104" rx="12"/>
    <rect class="strip" x="390" y="826" width="4" height="76" rx="2"/>
    <text class="title" x="410" y="840">Сеть есть?</text>
    <text class="body" x="410" y="863">Только для сетевых ошибок. Без сети</text>
    <text class="body" x="410" y="882">отправка ждёт и не тратит попытки</text>
    <text class="key" x="410" y="902">pauseWhenOffline · offlineCheckMs</text>
  </g>
  <g class="node stop">
    <rect class="card" x="880" y="812" width="290" height="104" rx="12"/>
    <rect class="strip" x="880" y="826" width="4" height="76" rx="2"/>
    <text class="title" x="900" y="840">Ожидание сети</text>
    <text class="body" x="900" y="863">Проверка каждые 15 с; потом снова</text>
    <text class="body" x="900" y="882">пауза перед отправкой и cooldown</text>
  </g>
  <g class="node send">
    <rect class="card" x="390" y="952" width="420" height="104" rx="12"/>
    <rect class="strip" x="390" y="966" width="4" height="76" rx="2"/>
    <text class="title" x="410" y="980">Отправка</text>
    <text class="body" x="410" y="1003">Текст по причине остановки, заметка</text>
    <text class="body" x="410" y="1022">о последнем инструменте, agent.followup</text>
    <text class="key" x="410" y="1042">continueText* · guardTools · resumeGoals</text>
  </g>
  <g class="node source">
    <rect class="card" x="30" y="952" width="290" height="104" rx="12"/>
    <rect class="strip" x="30" y="966" width="4" height="76" rx="2"/>
    <text class="title" x="50" y="980">Дочерние сессии</text>
    <text class="body" x="50" y="1003">Не продолжаются напрямую; после</text>
    <text class="body" x="50" y="1022">рестарта корень получает список</text>
    <text class="key" x="50" y="1042">resumeInterruptedChildren</text>
  </g>
  <g class="node source">
    <rect class="card" x="880" y="952" width="290" height="104" rx="12"/>
    <rect class="strip" x="880" y="966" width="4" height="76" rx="2"/>
    <text class="title" x="900" y="980">Resume now</text>
    <text class="body" x="900" y="1003">Кнопка в уведомлении: отправить</text>
    <text class="body" x="900" y="1022">сейчас, без паузы и лимитов</text>
  </g>
  <text class="foot" x="30" y="1102">После отправки новый ход отслеживается как обычно. Новый ход или ваше сообщение отменяют всё, что ещё ждёт отправки.</text>
  <text class="foot" x="30" y="1124">Счётчики хранятся в памяти хоста. Режимы сессий и глобальная пауза сохраняются в конфигурации профиля.</text>
</svg>
