name: plugin-check

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Clone dsh-plugin-check (pinned)
        run: |
          git clone --depth 1 https://github.com/omdsh-dev/dsh-plugin-check /tmp/dsh-plugin-check
          cd /tmp/dsh-plugin-check
          git fetch --depth 1 origin 397aa26df241aca530aa65a08484a664f7d555ad
          git checkout 397aa26df241aca530aa65a08484a664f7d555ad

      - name: Install checker dependencies
        working-directory: /tmp/dsh-plugin-check
        run: npm install --no-audit --no-fund

      - name: Run plugin_check
        run: node scripts/ci-plugin-check.mjs
